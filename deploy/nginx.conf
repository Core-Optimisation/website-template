# SiteForge — Nginx reverse proxy
#
# Two deployment shapes are shown. Pick ONE server block, set your domain,
# and add TLS (e.g. with certbot --nginx).
#
# Routing contract:
#   /admin, /api, /graphql      -> Payload CMS (Next.js) on 127.0.0.1:3000
#   everything else             -> the public website
#
# Media (local adapter) is served by the CMS from /api/media/file/... and via
# Payload's static route, so it is covered by the /api proxy below.

# ---------------------------------------------------------------------------
# OPTION A — RENDER_MODE=static (recommended)
# The website is a folder of files in apps/web/dist served directly by Nginx.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name example.com www.example.com;

    # --- CMS admin + API ---------------------------------------------------
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M; # allow media uploads
    }

    location /graphql {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static website ----------------------------------------------------
    root /var/www/siteforge/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
}

# ---------------------------------------------------------------------------
# OPTION B — RENDER_MODE=ssr
# The website is an Astro Node server on 127.0.0.1:4321 (run via PM2).
# Replace the OPTION A "Static website" block above with this location.
